<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>中国经济监测看板</title><style>body{font:16px system-ui;background:#f5f7fa;color:#182536;margin:0;padding:28px;max-width:1100px;margin:auto}h1{margin-bottom:6px}.sub{color:#617184}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(235px,1fr));gap:14px;margin-top:25px}.card{background:white;padding:20px;border-radius:14px;box-shadow:0 1px 6px #dfe4ed}.val{font-size:30px;font-weight:750;margin:14px 0}.muted{color:#69788a;font-size:13px}a{color:#245eae}.warn{padding:14px;background:#fff4dc;border-radius:8px;margin-top:20px}</style></head><body><h1>中国经济自动监测系统</h1><div class="sub">国家与广州指标 · 官方来源可追溯 · 无数据不填造</div><div id="meta" class="warn">正在读取数据...</div><div class="grid" id="grid"></div><script>fetch('./data.json').then(r=>r.json()).then(d=>{document.getElementById('meta').textContent='生成时间：'+d.generated_at+'｜已验证记录：'+d.data_count+'｜官方接口：待核验接入';document.getElementById('grid').innerHTML=d.indicators.map(i=>{const x=d.latest[i.id];return '<div class="card"><strong>'+i.name+'</strong><div class="val">'+(x?x.value+' '+i.unit:'待接入')+'</div><div class="muted">'+(x?'统计期：'+x.period:'暂无经过验证的官方数据')+'</div>'+(x?'<p><a href="'+x.source_url+'" target="_blank" rel="noopener">查看官方来源</a></p>':'')+'</div>'}).join('')}).catch(e=>{document.getElementById('meta').textContent='数据文件尚未生成，请运行 GitHub Actions';});</script></body></html>
