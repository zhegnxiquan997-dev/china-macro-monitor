name: 中国经济历史数据自动更新

on:
  push:
    branches: [main]
    paths:
      - archive_collector.py
      - release_scraper.py
      - tests/test_release_scraper.py
      - indicators.json
      - data/official_import.csv
      - .github/workflows/update.yml
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      backfill:
        description: "是否重新核对2000年以来全部可用年份"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: macro-history-update
  cancel-in-progress: false

jobs:
  update-history:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: 获取代码
        uses: actions/checkout@v4
      - name: 读取最新主分支历史库
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装采集依赖
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5"
      - name: 运行离线测试
        run: python -m unittest discover -s tests -v
      - name: 按官方来源采集和更新历史记录
        env:
          FORCE_BACKFILL: ${{ inputs.backfill || 'false' }}
        run: |
          if [ "$FORCE_BACKFILL" = "true" ]; then
            python archive_collector.py --backfill
          else
            python archive_collector.py
          fi
      - name: 保存历史版本、指标追踪与网页数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json data/collector_state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Archive and publish official macro history"
            git pull --rebase origin main
            git push
          fi
