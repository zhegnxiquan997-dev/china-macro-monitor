name: 首次回填2000年以来历史数据
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/initial-backfill.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: macro-history-update
  cancel-in-progress: false
jobs:
  full-history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: 读取最新主分支历史库
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "requests>=2.31,<3"
      - run: python -m unittest discover -s tests -v
      - name: 历史回填
        run: python archive_collector.py --backfill
      - name: 保存回填后的历史库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/observations.json data/collector_state.json docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Backfill official Chinese macro indicator history"
            git pull --rebase origin main
            git push
          fi
